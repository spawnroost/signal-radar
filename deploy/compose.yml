# Signal Radar production stack (one project, `signalradar`, on the shared VPS).
#   postgres -> migrate (one-shot) -> api, web, cron
# The edge Caddy lives in the mo-kalama project: it joins this project's network
# (`signalradar_default`) and reaches `signalradar-api:8787` / `signalradar-web:8080` by alias.
# api and web are also published on 127.0.0.1 only, for debugging with `curl` on the box.
#
# Server:  docker compose --env-file .env up -d          (see deploy/README.md; ship.sh does this)
# Local proof: docker compose -f deploy/compose.yml --env-file deploy/env.local --profile local up -d

name: ${COMPOSE_PROJECT_NAME:-signalradar}

x-logging: &logging
  options:
    max-size: '10m'
    max-file: '3'

x-db-url: &db-url postgres://radar:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/radar

x-api-env: &api-env
  NODE_ENV: production
  TZ: ${TZ:-UTC}
  DATABASE_URL: *db-url
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (32+ chars)}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL (public https origin)}
  WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN (public https origin)}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  UPI_VPA: ${UPI_VPA:-}
  UPI_PAYEE_NAME: ${UPI_PAYEE_NAME:-Signal Radar}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  # Read by the shared pipeline code when a user summarizes or searches.
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}

x-cron-env: &cron-env
  NODE_ENV: production
  TZ: ${TZ:-UTC}
  DATABASE_URL: *db-url
  # radar user:create hashes passwords with the same auth setup as the API.
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (32+ chars)}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL (public https origin)}
  WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN (public https origin)}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-}
  RADAR_AT: ${RADAR_AT:-03:00 15:00}
  REMIND_AT: ${REMIND_AT:-09:00}
  BACKUP_AT: ${BACKUP_AT:-02:00}
  BACKUP_KEEP: ${BACKUP_KEEP:-14}
  R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BACKUP_BUCKET: ${R2_BACKUP_BUCKET:-}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: radar
      TZ: ${TZ:-UTC}
    # No published port: reach it with `docker compose exec postgres psql` or the opt-in tunnel profile.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U radar -d radar']
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 1m
    logging: *logging

  migrate:
    image: signalradar-tools:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: tools
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: *db-url
    command: ['pnpm', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    image: signalradar-api:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment: *api-env
    ports:
      - '127.0.0.1:${HOST_API_PORT:-18787}:8787'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      default:
        aliases: [signalradar-api]
      edge:
        aliases: [signalradar-api]
    logging: *logging

  web:
    image: signalradar-web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:?set VITE_SITE_URL (public https origin)}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${HOST_WEB_PORT:-18080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      default:
        aliases: [signalradar-web]
      edge:
        aliases: [signalradar-web]
    logging: *logging

  # radar run at RADAR_AT, expiry reminders at REMIND_AT (UTC) plus the nightly backup at BACKUP_AT. Dumps live in the `backups` volume.
  cron:
    image: signalradar-tools:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment: *cron-env
    command: ['sh', '/app/deploy/cron.sh']
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *logging

  # Opt-in: `--profile tunnel up -d db-tunnel`, then `ssh -L 5433:127.0.0.1:15432 host`.
  db-tunnel:
    image: alpine/socat:latest
    profiles: ['tunnel']
    restart: unless-stopped
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:postgres:5432
    ports:
      - '127.0.0.1:${HOST_DB_PORT:-15432}:5432'
    depends_on:
      postgres:
        condition: service_healthy

  # Local proof only: runs the production Caddyfile.snippet with its site address swapped for :80,
  # so one origin serves /api/* and the web app exactly as on the server.
  edge-local:
    image: caddy:2-alpine
    profiles: ['local']
    restart: 'no'
    command:
      - sh
      - -c
      - >-
        sed -E 's|^signalradar\.spawnroost\.com|http://:80|' /snippet/Caddyfile.snippet > /tmp/Caddyfile &&
        caddy run --config /tmp/Caddyfile --adapter caddyfile
    volumes:
      - ./Caddyfile.snippet:/snippet/Caddyfile.snippet:ro
    ports:
      - '127.0.0.1:${HOST_EDGE_PORT:-18090}:80'
    depends_on:
      - api
      - web

networks:
  # The VPS-wide Caddy (/srv/edge) reaches api and web on this shared network.
  # Locally: `docker network create edge` once.
  edge:
    name: ${EDGE_NETWORK:-edge}
    external: true

volumes:
  pgdata:
  backups:
